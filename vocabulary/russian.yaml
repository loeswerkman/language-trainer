# Russian vocabulary: the source of truth for the words in the app.
# Loaded into the database when the server starts. Entries must be unique per word + category.
#
# Fields:
#   word                     Main English word (required)
#   wordAlternatives         Other accepted English answers (optional, defaults to [])
#   translation              Main Russian translation (required)
#   translationAlternatives  Other accepted Russian answers (optional, defaults to [])
#   category                 noun | verb | adjective | adverb | pronoun | preposition |
#                            conjunction | numeral | interjection | phrase (required)
#   tags                     Free-form labels for grouping (optional)
#   complexity               1 (easy) to 5 (hard) (required)
#   usefulness               1 (rarely used) to 5 (essential) (required)
#   notes                    Extra explanation shown after answering (optional)

